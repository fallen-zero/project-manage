[package]
name = "project-files-manage"
version = "0.1.0"
description = "项目资料管理软件：只登记路径、只建索引，不改动原始文件"
authors = ["zero"]
edition = "2021"
rust-version = "1.85"

[lib]
# Windows 上 lib 名必须与 bin 名不同，否则与可执行文件目标冲突
# 参见 https://github.com/rust-lang/cargo/issues/8519
name = "project_files_manage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-clipboard-manager = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
uuid = { version = "1.26.1", features = ["v4"] }
aes-gcm = "0.11.1"
argon2 = "0.6.0"
getrandom = "0.4.3"
thiserror = "2.0.21"
anyhow = "1.0.104"
jieba-rs = "0.11.0"
walkdir = "2.5.0"
chardetng = "1.0.0"
encoding_rs = "0.8.42"
quick-xml = "0.41.0"
pdf-extract = "0.12.1"
zip = "8.6.0"
calamine = "0.36.1"
notify = "8.2.0"
# M6 图片 OCR：走 Windows 原生识别器（Media::Ocr），不引第三方 OCR 引擎。
# feature 名已对 ~/.cargo/registry/src/*/windows-0.62.2/Cargo.toml 逐个核实；
# Graphics_Imaging/Storage/Storage_Streams 是 Task 2 的 image_text 预铺。
windows = { version = "0.62.2", features = [
  "Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams",
  "Foundation", "Foundation_Collections", "Globalization",
] }
# M10 日报导出：写 .xlsx。这个 crate 早在 Cargo.lock（extract.rs:419 的 xlsx 测试夹具拉它），
# 从 dev-dependencies 提为直接依赖不新增下载、也不新增编译单元 —— 与上面 sha2 同一格的处理。
# 不许改成「自己手写 SpreadsheetML」：仓里已经有 zip 8.6.0 与 quick-xml，但手写 sharedStrings、
# 日期格式、列宽这些的坑比换库的坑难查得多。
rust_xlsxwriter = "0.99.1"
# M8：备份包 manifest 的 SHA-256。仓库里没有现成哈希（aes-gcm/argon2 都不含 sha2，zip 8.6.0 只给 CRC32），
# 而技术方案 §6.2 明写 SHA-256。这个 crate 已在 Cargo.lock（lopdf/tauri-codegen/wry 拉 0.10.9，
# lzma-rust2 拉 0.11.0），提为直接依赖不新增下载、不新增编译单元；自己实现哈希是红线。
sha2 = "0.11"
# M16-b：备注截图的 data URL 编解码。0.22.1 已在 Cargo.lock（传递依赖），提为直接依赖不新增
# `[[package]]`、不新增编译单元；手写 base64 是红线。
base64 = "0.22"

[dev-dependencies]
tempfile = "3.27.0"

# 不许在这里写 panic = "abort"：abort 下 panic 不展开，`extract::pdf_text` 与
# `extract::panic_to_err`（M4 从 index_job 提上来，索引与预览两条路共用）/ worker 线程体里的
# catch_unwind 在发布包里一个都抓不到，一个畸形文件就直接终止整个进程。由
# `extract::tests::release_profile_does_not_abort_so_panic_guards_work` 钉住（终审 C1）。
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
