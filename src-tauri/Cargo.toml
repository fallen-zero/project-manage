[package]
name = "project-files-manage"
version = "0.1.0"
description = "项目资料管理软件：只登记路径、只建索引，不改动原始文件"
authors = ["zero"]
edition = "2021"
rust-version = "1.85"

[lib]
# Windows 上 lib 名必须与 bin 名不同，否则与可执行文件目标冲突
# 参见 https://github.com/rust-lang/cargo/issues/8519
name = "project_files_manage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-clipboard-manager = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v4"] }
thiserror = "2.0.21"
anyhow = "1.0.104"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
