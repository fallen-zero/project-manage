[package]
name = "project-files-manage"
version = "0.1.0"
description = "项目资料管理软件：只登记路径、只建索引，不改动原始文件"
authors = ["zero"]
edition = "2021"
rust-version = "1.85"

[lib]
# Windows 上 lib 名必须与 bin 名不同，否则与可执行文件目标冲突
# 参见 https://github.com/rust-lang/cargo/issues/8519
name = "project_files_manage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-clipboard-manager = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v4"] }
aes-gcm = "0.11.1"
argon2 = "0.6.0"
getrandom = "0.4.3"
thiserror = "2.0.21"
anyhow = "1.0.104"
jieba-rs = "0.11.0"
walkdir = "2.5.0"
chardetng = "1.0.0"
encoding_rs = "0.8.42"
quick-xml = "0.41.0"
pdf-extract = "0.12.1"
zip = "8.6.0"
calamine = "0.36.1"

[dev-dependencies]
rust_xlsxwriter = "0.99.1"
tempfile = "3.27.0"

# 不许在这里写 panic = "abort"：abort 下 panic 不展开，`extract::pdf_text` 与
# `extract::panic_to_err`（M4 从 index_job 提上来，索引与预览两条路共用）/ worker 线程体里的
# catch_unwind 在发布包里一个都抓不到，一个畸形文件就直接终止整个进程。由
# `extract::tests::release_profile_does_not_abort_so_panic_guards_work` 钉住（终审 C1）。
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
